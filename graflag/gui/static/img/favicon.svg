<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="GraFlag">
  <title>GraFlag</title>
  <!-- A graph with one node flagged: what the platform does, and what the
       name says. The tile gradient is the dashboard's own primary/secondary
       so the mark and the UI cannot drift apart. -->
  <defs>
    <linearGradient id="gf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#gf-tile)"/>

  <!-- edges -->
  <g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity="0.92">
    <path d="M9.5 22.5 L16 15"/>
    <path d="M16 15 L22.5 22.5"/>
    <path d="M9.5 22.5 L22.5 22.5"/>
  </g>

  <!-- ordinary nodes -->
  <g fill="#FFFFFF">
    <circle cx="9.5" cy="22.5" r="2.7"/>
    <circle cx="22.5" cy="22.5" r="2.7"/>
  </g>

  <!-- the anomaly, flagged -->
  <path d="M16 14.6 L16 6.2" stroke="#FBBF24" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M16.8 6.4 L22.2 8.3 L16.8 10.2 Z" fill="#FBBF24"/>
  <circle cx="16" cy="15" r="3.1" fill="#FBBF24"/>
</svg>
