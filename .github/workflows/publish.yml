name: Publish to PyPI

# A published GitHub release (tag vX.Y.Z) becomes graflag X.Y.Z on PyPI:
# the test suite runs first, the build refuses a version that is not the
# tag's, and the upload uses PyPI Trusted Publishing (OIDC), so no token is
# stored in the repository. PyPI must list this repository, this workflow file
# and the `pypi` environment as a trusted publisher of the graflag project.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Unit tests (no cluster, no network)
        run: python -m unittest discover -s tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the metadata PyPI will render
        run: twine check dist/*
      - name: Check the version against the release tag
        if: github.event_name == 'release'
        run: |
          built=$(ls dist/*.whl | sed -E 's#dist/graflag-([^-]+)-.*#\1#')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tag" ]; then
            echo "::error::the build is graflag $built but the release is tagged $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graflag
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
